<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>HLD — Study Atlas</title><style>body{margin:0;background:#f5f8fb;color:#36536b;font-family:Arial,sans-serif}main{max-width:1250px;margin:auto;padding:26px}header{display:flex;gap:18px;align-items:center;justify-content:space-between}h1{font-size:24px}p{font-size:13px;line-height:1.8;color:#7a94a8}.canvas{overflow:auto;border:1px solid #d7e6f0;border-radius:16px;background:white;margin-top:22px}svg{display:block;max-width:none}g[role=button]{cursor:pointer}g[role=button]:hover rect,g[role=button]:focus rect{stroke:#4483ae;stroke-width:3}button,a{border:1px solid #cadde9;padding:10px 14px;border-radius:6px;background:white;color:#577e99;font-size:12px;text-decoration:none;cursor:pointer}#detail{margin-top:20px;padding:20px;border-radius:12px;background:#eaf3fa}#detail:empty{display:none}footer{display:flex;gap:15px;margin-top:22px;flex-wrap:wrap}@media print{header,footer,#detail{display:none}.canvas{overflow:visible;margin:0;border:0;break-inside:avoid}svg{width:100%;height:180mm;max-height:180mm;object-fit:contain}main{padding:0;max-width:none}@page{size:A4 landscape;margin:10mm}}</style></head><body><main><header><div><h1>HLD · High-level architecture</h1><p>Document preparation, evidence retrieval and source-grounded learning. Click a component for details.</p></div><button onclick="window.print()">Print / Save PDF</button></header><div class="canvas"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" role="group" aria-label="High-level architecture diagram" font-family="Arial,sans-serif"><defs><marker id="arch-arrow-HLD" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8faec5"/></marker></defs><text x="30" y="30" font-size="18" font-weight="600" fill="#244c69">HLD · High-level architecture</text><rect x="20" y="60" width="800" height="685" rx="18 er-end="url(#arch-arrow-HLD)"/><path d="M425,415 C425,492.5 165,492.5 165,570" fill="none" stroke="#abbb8b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arch-arrow-HLD)"/><path d="M685,415 C685,492.5 165,492.5 165,570" fill="none" stroke="#abbb8b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arch-arrow-HLD)"/><path d="M275,625 C295,625 295,635 315,635" fill="none" stroke="#abbb8b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arch-arrow-HLD)"/><g data-node-id="upload" role="button" tabindex="0" aria-label="Explore Upload PDF"><rect x="50" y="115" width="220" height="100" rx="12" fill="#edf5fc" stroke="#bcd2e2" stroke-width="1.5"/><text x="65" y="144" font-size="16" font-weight="600" fill="#315d7b">Upload PDF</text><text x="65" y="168" font-size="12" fill="#718da1">Class · subject · language</text><text x="65" y="188" font-size="12" fill="#718da1">20 MB / 200-page limit</text><title>Student selects learning context and a text PDF. The original file stays on the device.</title></g><g data-node-id="pdf" role="button" tabindex="0" aria-label="Explore PDF.js extraction"><rect x="315" y="115" width="220" height="100" rx="12" fill="#edf5fc" stroke="#bcd2e2" stroke-width="1.5"/><text x="330" y="144" font-size="16" font-weight="600" fill="#315d7b">PDF.js extraction</text><text x="330" y="168" font-size="12" fill="#718da1">Readable text per page</text><text x="330" y="188" font-size="12" fill="#718da1">Warnings for scanned pages</text><title>Browser worker extracts text and preserves PDF page numbers. OCR and diagram understanding are not implemented.</title></g><g data-node-id="store" role="button" tabindex="0" aria-label="Explore Session index"><rect x="580" y="115" width="210" height="100" rx="12" fill="#edf5fc" stroke="#bcd2e2" stroke-width="1.5"/><text x="595" y="144" font-size="16" font-weight="600" fill="#315d7b">Session index</text><text x="595" y="168" font-size="12" fill="#718da1">Chunks + source metadata</text><text x="595" y="188" font-size="12" fill="#718da1">Optional local vectors</text><title>Text, source IDs, vectors and generated results are held in this browser session. No Qdrant or persistent document database.</title></g><g data-node-id="question" role="button" tabindex="0" aria-label="Explore Student question"><rect x="50" y="305" width="220" height="110" rx="12" fill="#edf5fc" stroke="#bcd2e2" stroke-width="1.5"/><text x="65" y="334" font-size="16" font-weight="600" fill="#315d7b">Student question</text><text x="65" y="358" font-size="12" fill="#718da1">English or Tamil</text><text x="65" y="378" font-size="12" fill="#718da1">Local or server query translation</text><title>Tamil questions can use local browser translation or the protected AI endpoint before retrieval.</title></g><g data-node-id="retrieve" role="button" tabindex="0" aria-label="Explore Evidence retrieval"><rect x="315" y="305" width="220" height="110" rx="12" fill="#edf5fc" stroke="#bcd2e2" stroke-width="1.5"/><text x="330" y="334" font-size="16" font-weight="600" fill="#315d7b">Evidence retrieval</text><text x="330" y="358" font-size="12" fill="#718da1">BM25 keyword baseline</text><text x="330" y="378" font-size="12" fill="#718da1">Optional E5 + rank fusion</text><title>Question answering retrieves up to five relevant passages. Scores are ranking values, not answer confidence.</title></g><g data-node-id="batch" role="button" tabindex="0" aria-label="Explore Document coverage"><rect x="580" y="305" width="210" height="110" rx="12" fill="#edf5fc" stroke="#bcd2e2" stroke-width="1.5"/><text x="595" y="334" font-size="16" font-weight="600" fill="#315d7b">Document coverage</text><text x="595" y="358" font-size="12" fill="#718da1">Every readable chunk</text><text x="595" y="378" font-size="12" fill="#718da1">Bounded section batches</text><title>Whole-document study materials cover all readable sections instead of summarizing only top-K results.</title></g><g data-node-id="api" role="button" tabindex="0" aria-label="Explore Protected study API"><rect x="885" y="115" width="260" height="100" rx="12" fill="#edf1dd" stroke="#bcd2e2" stroke-width="1.5"/><text x="900" y="144" font-size="16" font-weight="600" fill="#315d7b">Protected study API</text><text x="900" y="168" font-size="12" fill="#718da1">Workspace access token</text><text x="900" y="188" font-size="12" fill="#718da1">Server-side provider secret</text><title>Stateless Vercel endpoint validates input size, task and authentication. Keys are never exposed to the frontend.</title></g><g data-node-id="validate" role="button" tabindex="0" aria-label="Explore Validate generated output"><rect x="885" y="320" width="260" height="110" rx="12" fill="#edf1dd" stroke="#bcd2e2" stroke-width="1.5"/><text x="900" y="349" font-size="16" font-weight="600" fill="#315d7b">Validate generated output</text><text x="900" y="373" font-size="12" fill="#718da1">Structured items + source IDs</text><text x="900" y="393" font-size="12" fill="#718da1">Exact textbook-quote checks</text><title>Rejects invalid schemas, unknown nested citations, invalid MCQs and invented textbook quotes. This does not prove every explanation is factually supported.</title></g><g data-node-id="llm" role="button" tabindex="0" aria-label="Explore Groq language model"><rect x="885" y="550" width="260" height="110" rx="12" fill="#f8ecd5" stroke="#bcd2e2" stroke-width="1.5"/><text x="900" y="579" font-size="16" font-weight="600" fill="#315d7b">Groq language model</text><text x="900" y="603" font-size="12" fill="#718da1">Evidence + teaching prompt</text><text x="900" y="623" font-size="12" fill="#718da1">English / Tamil / Hindi output</text><title>Runs only when provider credentials and a workspace token are configured. No live provider result is claimed from demo outputs.</title></g><g data-node-id="local" role="button" tabindex="0" aria-label="Explore Local translation worker"><rect x="55" y="570" width="220" height="110" rx="12" fill="#edf5fc" stroke="#bcd2e2" stroke-width="1.5"/><text x="70" y="599" font-size="16" font-weight="600" fill="#315d7b">Local translation worker</text><text x="70" y="623" font-size="12" fill="#718da1">Tamil / Hindi · q8 NLLB</text><text x="70" y="643" font-size="12" fill="#718da1">On-device WASM · cached download</text><title>Runs in a web worker without provider keys. Original quotations, formulas and citations remain unchanged. Download around 900 MB; translated source aids are not new explanations.</title></g><g data-node-id="output" role="button" tabindex="0" aria-label="Explore Student learning outputs"><rect x="315" y="570" width="475" height="130" rx="12" fill="#edf5fc" stroke="#bcd2e2" stroke-width="1.5"/><text x="330" y="599" font-size="16" font-weight="600" fill="#315d7b">Student learning outputs</text><text x="330" y="623" font-size="12" fill="#718da1">Professional mind map · focused roadmap</text><text x="330" y="643" font-size="12" fill="#718da1">Structured notes · visual cards · MCQs · answers</text><text x="330" y="663" font-size="12" fill="#718da1">Source viewer · measured process · export</text><title>Editable code-native visuals and source-linked learning items. Local mode translates source study aids. Source preview and manually authored bilingual demo remain explicitly labelled.</title></g></svg></div><div id="detail" aria-live="polite"></div><footer><a href="HLD.svg" download>Download diagram SVG</a><a href="LLD.html">LLD diagram</a><a href="/">Study Atlas</a></footer></main><script>const nodes=[{"id":"upload","x":50,"y":115,"w":220,"h":100,"title":"Upload PDF","lines":["Class · subject · language","20 MB / 200-page limit"],"detail":"Student selects learning context and a text PDF. The original file stays on the device.","color":"#edf5fc"},{"id":"pdf","x":315,"y":115,"w":220,"h":100,"title":"PDF.js extraction","lines":["Readable text per page","Warnings for scanned pages"],"detail":"Browser worker extracts text and preserves PDF page numbers. OCR and diagram understanding are not implemented.","c imed from demo outputs.","color":"#f8ecd5"},{"id":"local","x":55,"y":570,"w":220,"h":110,"title":"Local translation worker","lines":["Tamil / Hindi · q8 NLLB","On-device WASM · cached download"],"detail":"Runs in a web worker without provider keys. Original quotations, formulas and citations remain unchanged. Download around 900 MB; translated source aids are not new explanations.","color":"#edf5fc"},{"id":"output","x":315,"y":570,"w":475,"h":130,"title":"Student learning outputs","lines":["Professional mind map · focused roadmap","Structured notes · visual cards · MCQs · answers","Source viewer · measured process · export"],"detail":"Editable code-native visuals and source-linked learning items. Local mode translates source study aids. Source preview and manually authored bilingual demo remain explicitly labelled.","color":"#edf5fc"}];const canvas=document.querySelector('.canvas');function select(event){const node=event.target.closest('[data-node-id]');if(!node)return;const found=nodes.find(n=>n.id===node.dataset.nodeId);document.getElementById('detail').textContent=found.title+' — '+found.detail;}canvas.addEventListener('click',select);canvas.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();select(event);}});</script></body></html>
