<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1150" width="1200" height="1150" role="group" aria-label="Low-level component flow diagram" font-family="Arial,sans-serif"><defs><marker id="arch-arrow-LLD" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8faec5"/></marker></defs><text x="30" y="30" font-size="18" font-weight="600" fill="#244c69">LLD · Low-level component flow</text><rect x="20" y="55" width="1160" height="1055" rx="18" fill="#fafcfe" stroke="#d7e5ef" stroke-dasharray="5 5"/><text x="38" y="80" font-size="11" font-weight="600" fill="#7893a7">IMPLEMENTED MODULES · OPTIONAL AI PATH IS LABELLED</text><path d="M600,215 C600,262.5 210,262.5 210,310" fill="none" stroke="#8faec5" stroke-width="2"  marker-end="url(#arch-arrow-LLD)"/><path d="M600,215 C600,262.5 600,262.5 600,310" fill="none" stroke="#8faec5" stroke-width="2"  marker-end="url(#arch-arrow-LLD)"/><path d="M600,215 C600,262.5 990,262.5 990,310" fill="none" stroke="#8faec5" stroke-width="2"  marker-end="url(#arch-arrow-LLD)"/><path d="M365,365 C405,365 405,365 445,365" fill="none" stroke="#8faec5" stroke-width="2"  marker-end="url(#arch-arrow-LLD)"/><path d="M755,365 C795,365 795,365 835,365" fill="none" stroke="#8faec5" stroke-width="2"  marker-end="url(#arch-arrow-LLD)"/><path d="M600,420 C600,475 600,475 600,530" fill="none" stroke="#8faec5" stroke-width="2"  marker-end="url(#arch-arrow-LLD)"/><path d="M600,420 C600,475 210,475 210,530" fill="none" stroke="#8faec5" stroke-width="2"  marker-end="url(#arch-arrow-LLD)"/><path d="M755,585 C795,585 795,585 835,585" fill="none" stroke="#8faec5" stroke-width="2"  marker-end="url(#arch-arrow-LLD)"/><path d="M990,640 C990,805 600,805 600,970" fill="none" stroke="#8faec5" stroke-width="2"  marker-end="url(#arch-arrow-LLD)"/><path d="M210,640 C210,805 600,805 600,970" fill="none" stroke="#8faec5" stroke-width="2"  marker-end="url(#arch-arrow-LLD)"/><path d="M600,640 C600,805 600,805 600,970" fill="none" stroke="#8faec5" stroke-width="2"  marker-end="url(#arch-arrow-LLD)"/><path d="M210,640 C210,695 210,695 210,750" fill="none" stroke="#8faec5" stroke-width="2"  marker-end="url(#arch-arrow-LLD)"/><path d="M210,870 C210,920 600,920 600,970" fill="none" stroke="#8faec5" stroke-width="2"  marker-end="url(#arch-arrow-LLD)"/><g data-node-id="app" role="button" tabindex="0" aria-label="Explore App.jsx · state controller"><rect x="415" y="110" width="370" height="105" rx="12" fill="#edf5fc" stroke="#bcd2e2" stroke-width="1.5"/><text x="430" y="139" font-size="16" font-weight="600" fill="#315d7b">App.jsx · state controller</text><text x="430" y="163" font-size="12" fill="#718da1">Document · language · cache · source modal</text><text x="430" y="183" font-size="12" fill="#718da1">Routes tools, generation and Q&amp;A</text><title>Owns the session state, clears data on document replacement, selects local translation for Tamil source requests, and passes structured items to rendering components.</title></g><g data-node-id="pdf" role="button" tabindex="0" aria-label="Explore pdf.js · preparation"><rect x="55" y="310" width="310" height="110" rx="12" fill="#edf5fc" stroke="#bcd2e2" stroke-width="1.5"/><text x="70" y="339" font-size="16" font-weight="600" fill="#315d7b">pdf.js · preparation</text><text x="70" y="363" font-size="12" fill="#718da1">Signature → pages → text → headings</text><text x="70" y="383" font-size="12" fill="#718da1">Chunking + source lookup + timings</text><title>Preserves PDF page provenance. Limits and extraction warnings are surfaced before generation.</title></g><g data-node-id="rag" role="button" tabindex="0" aria-label="Explore rag.js · evidence selection"><rect x="445" y="310" width="310" height="110" rx="12" fill="#edf5fc" stroke="#bcd2e2" stroke-width="1.5"/><text x="460" y="339" font-size="16" font-weight="600" fill="#315d7b">rag.js · evidence selection</text><text x="460" y="363" font-size="12" fill="#718da1">Page-aware chunks · BM25 · rank fusion</text><text x="460" y="383" font-size="12" fill="#718da1">Top-K Q&amp;A / full section batches</text><title>Question retrieval and whole-document generation have different coverage rules. Exact duplicate text is removed.</title></g><g data-node-id="semantic" role="button" tabindex="0" aria-label="Explore semantic.js · optional E5"><rect x="835" y="310" width="310" height="110" rx="12" fill="#edf5fc" stroke="#bcd2e2" stroke-width="1.5"/><text x="850" y="339" font-size="16" font-weight="600" fill="#315d7b">semantic.js · optional E5</text><text x="850" y="363" font-size="12" fill="#718da1">WASM model downloaded on demand</text><text x="850" y="383" font-size="12" fill="#718da1">Normalized passage/query vectors</text><title>Uses passage: and query: prefixes. Local vectors are fused with positive keyword matches; relevance rejection still needs calibration.</title></g><g data-node-id="demo" role="button" tabindex="0" aria-label="Explore pedagogy + demo materials"><rect x="55" y="530" width="310" height="110" rx="12" fill="#edf5fc" stroke="#bcd2e2" stroke-width="1.5"/><text x="70" y="559" font-size="16" font-weight="600" fill="#315d7b">pedagogy + demo materials</text><text x="70" y="583" font-size="12" fill="#718da1">Concise source answer / source preview</text><text x="70" y="603" font-size="12" fill="#718da1">Explicit bilingual demo fixture</text><title>Demo Tamil content is manually authored for the four original pages. Original demo is manually authored. Uploaded documents can use the local translation worker without service keys.</title></g><g data-node-id="api" role="button" tabindex="0" aria-label="Explore api/study.js · AI contract"><rect x="445" y="530" width="310" height="110" rx="12" fill="#edf5fc" stroke="#bcd2e2" stroke-width="1.5"/><text x="460" y="559" font-size="16" font-weight="600" fill="#315d7b">api/study.js · AI contract</text><text x="460" y="583" font-size="12" fill="#718da1">Translate query / generate study items</text><text x="460" y="603" font-size="12" fill="#718da1">Zod input and result validation</text><title>Checks token, evidence limits, feature-specific teaching structure, nested citations, exact source quotes and MCQ answer membership.</title></g><g data-node-id="provider" role="button" tabindex="0" aria-label="Explore Groq completion"><rect x="835" y="530" width="310" height="110" rx="12" fill="#edf5fc" stroke="#bcd2e2" stroke-width="1.5"/><text x="850" y="559" font-size="16" font-weight="600" fill="#315d7b">Groq completion</text><text x="850" y="583" font-size="12" fill="#718da1">Bounded evidence and output</text><text x="850" y="603" font-size="12" fill="#718da1">Timeout · usage · measured latency</text><title>Provider key stays on the server. Errors do not overwrite previous cached material.</title></g><g data-node-id="local" role="button" tabindex="0" aria-label="Explore translation.js + web worker"><rect x="55" y="750" width="310" height="120" rx="12" fill="#edf5fc" stroke="#bcd2e2" stroke-width="1.5"/><text x="70" y="779" font-size="16" font-weight="600" fill="#315d7b">translation.js + web worker</text><text x="70" y="803" font-size="12" fill="#718da1">Queued requests · progress · cancellation</text><text x="70" y="823" font-size="12" fill="#718da1">q8 NLLB → structured translated items</text><title>translation-core.js preserves nested source IDs, formulas and original quotes. The worker translates short segments and caches strings only in memory; downloaded model files use browser cache.</title></g><g data-node-id="render" role="button" tabindex="0" aria-label="Explore Structured output → visual learning"><rect x="250" y="970" width="700" height="90" rx="12" fill="#edf5fc" stroke="#bcd2e2" stroke-width="1.5"/><text x="265" y="999" font-size="16" font-weight="600" fill="#315d7b">Structured output → visual learning</text><text x="265" y="1023" font-size="12" fill="#718da1">StudyGraph · StudyNotes · Flashcards · MCQ scoring</text><text x="265" y="1043" font-size="12" fill="#718da1">Source inspection · SVG/print exports · evidence timeline</text><title>Mind maps use named subtopics; notes have definition/key-point/formula blocks; roadmaps expose goals and self-checks; HLD/LLD are rendered diagrams.</title></g></svg>