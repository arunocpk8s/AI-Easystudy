<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" role="group" aria-label="High-level architecture diagram" font-family="Arial,sans-serif"><defs><marker id="arch-arrow-HLD" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8faec5"/></marker></defs><text x="30" y="30" font-size="18" font-weight="600" fill="#244c69">HLD · High-level architecture</text><rect x="20" y="60" width="800" height="685" rx="18" fill="#f8fbfe" stroke="#d7e5ef" stroke-dasharray="5 5"/><text x="38" y="85" font-size="11" font-weight="600" fill="#7893a7">STUDENT DEVICE · PRIVATE SESSION</text><rect x="850" y="60" width="330" height="420" rx="18" fill="#f7f8f1" stroke="#d7e5ef" stroke-dasharray="5 5"/><text x="868" y="85" font-size="11" font-weight="600" fill="#7893a7">VERCEL · SERVER TRUST BOUNDARY</text><rect x="850" y="505" width="330" height="210" rx="18" fill="#fcf7ef" stroke="#d7e5ef" stroke-dasharray="5 5"/><text x="868" y="530" font-size="11" font-weight="600" fill="#7893a7">EXTERNAL AI PROVIDER</text><path d="M270,165 C292.5,165 292.5,165 315,165" fill="none" stroke="#8faec5" stroke-width="2"  marker-end="url(#arch-arrow-HLD)"/><path d="M535,165 C557.5,165 557.5,165 580,165" fill="none" stroke="#8faec5" stroke-width="2"  marker-end="url(#arch-arrow-HLD)"/><path d="M685,215 C685,260 425,260 425,305" fill="none" stroke="#8faec5" stroke-width="2"  marker-end="url(#arch-arrow-HLD)"/><path d="M685,215 C685,260 685,260 685,305" fill="none" stroke="#8faec5" stroke-width="2"  marker-end="url(#arch-arrow-HLD)"/><path d="M270,360 C292.5,360 292.5,360 315,360" fill="none" stroke="#8faec5" stroke-width="2"  marker-end="url(#arch-arrow-HLD)"/><path d="M425,305 C425,260 1015,260 1015,215" fill="none" stroke="#8faec5" stroke-width="2"  marker-end="url(#arch-arrow-HLD)"/><path d="M685,305 C685,260 1015,260 1015,215" fill="none" stroke="#8faec5" stroke-width="2"  marker-end="url(#arch-arrow-HLD)"/><path d="M1145,170 C1165,170 1165,540 1015,550" fill="none" stroke="#8faec5" stroke-width="2"  marker-end="url(#arch-arrow-HLD)"/><path d="M885,605 C862,605 860,445 915,430" fill="none" stroke="#8faec5" stroke-width="2"  marker-end="url(#arch-arrow-HLD)"/><path d="M1015,430 C1015,500 552.5,500 552.5,570" fill="none" stroke="#8faec5" stroke-width="2"  marker-end="url(#arch-arrow-HLD)"/><path d="M425,415 C425,492.5 552.5,492.5 552.5,570" fill="none" stroke="#abbb8b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arch-arrow-HLD)"/><path d="M425,415 C425,492.5 165,492.5 165,570" fill="none" stroke="#abbb8b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arch-arrow-HLD)"/><path d="M685,415 C685,492.5 165,492.5 165,570" fill="none" stroke="#abbb8b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arch-arrow-HLD)"/><path d="M275,625 C295,625 295,635 315,635" fill="none" stroke="#abbb8b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arch-arrow-HLD)"/><g data-node-id="upload" role="button" tabindex="0" aria-label="Explore Upload study files"><rect x="50" y="115" width="220" height="100" rx="12" fill="#edf5fc" stroke="#bcd2e2" stroke-width="1.5"/><text x="65" y="144" font-size="16" font-weight="600" fill="#315d7b">Upload study files</text><text x="65" y="168" font-size="12" fill="#718da1">Class · subject · language</text><text x="65" y="188" font-size="12" fill="#718da1">20 MB / 200-section limit</text><title>Student selects learning context and PDF, Office, images or text. The original file stays on the device.</title></g><g data-node-id="pdf" role="button" tabindex="0" aria-label="Explore Document readers + OCR"><rect x="315" y="115" width="220" height="100" rx="12" fill="#edf5fc" stroke="#bcd2e2" stroke-width="1.5"/><text x="330" y="144" font-size="16" font-weight="600" fill="#315d7b">Document readers + OCR</text><text x="330" y="168" font-size="12" fill="#718da1">PDF / Office / text / images</text><text x="330" y="188" font-size="12" fill="#718da1">Source references + coverage</text><title>documents.js dispatches PDF.js, bounded Office ZIP/XML readers and SheetJS. Tesseract reads printed scans and images. Legacy DOC requires conversion to DOCX or PDF. English/Tamil/Hindi OCR stays on-device; blank pages skip it. Verify transcriptions against original scans. Diagram understanding is not implemented.</title></g><g data-node-id="store" role="button" tabindex="0" aria-label="Explore Session index"><rect x="580" y="115" width="210" height="100" rx="12" fill="#edf5fc" stroke="#bcd2e2" stroke-width="1.5"/><text x="595" y="144" font-size="16" font-weight="600" fill="#315d7b">Session index</text><text x="595" y="168" font-size="12" fill="#718da1">Chunks + source metadata</text><text x="595" y="188" font-size="12" fill="#718da1">Optional local vectors</text><title>Text, source IDs, vectors and generated results are held in this browser session. No Qdrant or persistent document database.</title></g><g data-node-id="question" role="button" tabindex="0" aria-label="Explore Student question"><rect x="50" y="305" width="220" height="110" rx="12" fill="#edf5fc" stroke="#bcd2e2" stroke-width="1.5"/><text x="65" y="334" font-size="16" font-weight="600" fill="#315d7b">Student question</text><text x="65" y="358" font-size="12" fill="#718da1">English or Tamil</text><text x="65" y="378" font-size="12" fill="#718da1">Local or server query translation</text><title>Tamil questions can use local browser translation or the protected AI endpoint before retrieval.</title></g><g data-node-id="retrieve" role="button" tabindex="0" aria-label="Explore Evidence retrieval"><rect x="315" y="305" width="220" height="110" rx="12" fill="#edf5fc" stroke="#bcd2e2" stroke-width="1.5"/><text x="330" y="334" font-size="16" font-weight="600" fill="#315d7b">Evidence retrieval</text><text x="330" y="358" font-size="12" fill="#718da1">BM25 keyword baseline</text><text x="330" y="378" font-size="12" fill="#718da1">Optional E5 + rank fusion</text><title>Question answering retrieves up to five relevant passages. Scores are ranking values, not answer confidence.</title></g><g data-node-id="batch" role="button" tabindex="0" aria-label="Explore Document coverage"><rect x="580" y="305" width="210" height="110" rx="12" fill="#edf5fc" stroke="#bcd2e2" stroke-width="1.5"/><text x="595" y="334" font-size="16" font-weight="600" fill="#315d7b">Document coverage</text><text x="595" y="358" font-size="12" fill="#718da1">Every readable chunk</text><text x="595" y="378" font-size="12" fill="#718da1">Bounded section batches</text><title>Whole-document study materials cover all readable sections instead of summarizing only top-K results.</title></g><g data-node-id="api" role="button" tabindex="0" aria-label="Explore Protected study API"><rect x="885" y="115" width="260" height="100" rx="12" fill="#edf1dd" stroke="#bcd2e2" stroke-width="1.5"/><text x="900" y="144" font-size="16" font-weight="600" fill="#315d7b">Protected study API</text><text x="900" y="168" font-size="12" fill="#718da1">Workspace access token</text><text x="900" y="188" font-size="12" fill="#718da1">Server-side provider secret</text><title>Stateless Vercel endpoint validates input size, task and authentication. Keys are never exposed to the frontend.</title></g><g data-node-id="validate" role="button" tabindex="0" aria-label="Explore Validate generated output"><rect x="885" y="320" width="260" height="110" rx="12" fill="#edf1dd" stroke="#bcd2e2" stroke-width="1.5"/><text x="900" y="349" font-size="16" font-weight="600" fill="#315d7b">Validate generated output</text><text x="900" y="373" font-size="12" fill="#718da1">Structured items + source IDs</text><text x="900" y="393" font-size="12" fill="#718da1">Exact textbook-quote checks</text><title>Rejects invalid schemas, unknown nested citations, invalid MCQs and invented textbook quotes. This does not prove every explanation is factually supported.</title></g><g data-node-id="llm" role="button" tabindex="0" aria-label="Explore Groq language model"><rect x="885" y="550" width="260" height="110" rx="12" fill="#f8ecd5" stroke="#bcd2e2" stroke-width="1.5"/><text x="900" y="579" font-size="16" font-weight="600" fill="#315d7b">Groq language model</text><text x="900" y="603" font-size="12" fill="#718da1">Evidence + teaching prompt</text><text x="900" y="623" font-size="12" fill="#718da1">English / Tamil / Hindi output</text><title>Runs only when provider credentials and a workspace token are configured. No live provider result is claimed from demo outputs.</title></g><g data-node-id="local" role="button" tabindex="0" aria-label="Explore Local translation worker"><rect x="55" y="570" width="220" height="110" rx="12" fill="#edf5fc" stroke="#bcd2e2" stroke-width="1.5"/><text x="70" y="599" font-size="16" font-weight="600" fill="#315d7b">Local translation worker</text><text x="70" y="623" font-size="12" fill="#718da1">Tamil / Hindi · q8 NLLB</text><text x="70" y="643" font-size="12" fill="#718da1">On-device WASM · cached download</text><title>Runs in a web worker without provider keys. Original quotations, formulas and citations remain unchanged. Download around 900 MB; translated source aids are not new explanations.</title></g><g data-node-id="output" role="button" tabindex="0" aria-label="Explore Student learning outputs"><rect x="315" y="570" width="475" height="130" rx="12" fill="#edf5fc" stroke="#bcd2e2" stroke-width="1.5"/><text x="330" y="599" font-size="16" font-weight="600" fill="#315d7b">Student learning outputs</text><text x="330" y="623" font-size="12" fill="#718da1">Professional mind map · focused roadmap</text><text x="330" y="643" font-size="12" fill="#718da1">Structured notes · visual cards · MCQs · answers</text><text x="330" y="663" font-size="12" fill="#718da1">Source viewer · measured process · export</text><title>Editable code-native visuals and source-linked learning items. Local mode translates source study aids. Source preview and manually authored bilingual demo remain explicitly labelled.</title></g></svg>